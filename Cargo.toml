[package]
name = "bbpipelinewait"
authors = ["Scott Jackson <me@scottmmjackson.com>"]
version = "1.0.12"
description = "Tool to list running bitbucket pipelines and wait for them to stop."
edition = "2024"
license = "GPL-3.0"

[dependencies]
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
clap = { version = "4.6.1", features = ["cargo", "env"] }
reqwest = { version = "0.13.4", features = ["json", "native-tls-vendored"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
directories = "6.0.0"
base64 = "0.22.1"
strum_macros = "0.28.0"
strum = "0.28.0"
log = "0.4.33"
url = "2.5.8"
spinner = "0.5.0"
termsize = "0.1.9"
inquire = "0.9.4"
